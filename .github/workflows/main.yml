name: UI Tests Pipeline
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      TARGET_ENV:
        description: 'Окружение'
        default: 'dev'
        type: choice
        options:
          - dev
          - stage
      BROWSER_LIST:
        description: 'Браузер(ы)'
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
      TEST_TYPE:
        description: 'Тип тестов (маркер)'
        default: ''
        type: string
      TEST_FILES:
        description: 'Файлы/папки с тестами (через запятую)'
        default: 'tests/'
        type: string
env:
  # Отключаем надоедливые системные предупреждения GitHub о переходе на Node.js 24
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  validate_pipeline_inputs:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Проверка параметров
        run: |
          echo "Окружение: ${{ github.event.inputs.TARGET_ENV || 'dev' }}"
          echo "Браузеры: ${{ github.event.inputs.BROWSER_LIST || 'chromium' }}"
          echo "✅ Параметры проверены — всё ок"
  setup_matrix:
    needs: validate_pipeline_inputs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: ⚙️ Настройка матрицы браузеров
        id: set-matrix
        run: |
          BROWSER_LIST="${{ github.event.inputs.BROWSER_LIST }}"
          if [ -z "$BROWSER_LIST" ]; then
            BROWSER_LIST="chromium"
          fi
          if [[ "$BROWSER_LIST" == "all" ]]; then
            echo 'matrix=["chromium", "firefox", "webkit"]' >> $GITHUB_OUTPUT
          else
            echo "matrix=[\"$BROWSER_LIST\"]" >> $GITHUB_OUTPUT
          fi
  testing:
    needs: setup_matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Если упадет Firefox, Chromium всё равно продолжит работу
      matrix:
        browser: ${{ fromJson(needs.setup_matrix.outputs.matrix) }}
    steps:
      - name: 📥 Чекаут кода
        uses: actions/checkout@v4
      - name: 🔐 Создание .env из секретов
        run: |
          ENV_NAME="${{ github.event.inputs.TARGET_ENV }}"
          if [ -z "$ENV_NAME" ]; then
            ENV_NAME="dev"
          fi
          if [ "$ENV_NAME" = "dev" ]; then
            URL="${{ secrets.DEV_URL }}"
            DEFAULT_USER="${{ secrets.DEV_DEFAULT_USER }}"
            # Сохраняем JSON с помощью toJSON(fromJSON(...))
            USERS='${{ toJSON(fromJSON(secrets.DEV_USERS)) }}'
          elif [ "$ENV_NAME" = "stage" ]; then
            URL="${{ secrets.STAGE_URL }}"
            DEFAULT_USER="${{ secrets.STAGE_DEFAULT_USER }}"
            USERS='${{ toJSON(fromJSON(secrets.STAGE_USERS)) }}'
          else
            echo "❌ Неизвестное окружение: $ENV_NAME"
            exit 1
          fi
          printf "URL=%s\n" "$URL" > ".env.$ENV_NAME"
          printf "DEFAULT_USER=%s\n" "$DEFAULT_USER" >> ".env.$ENV_NAME"
          printf "USERS=%s\n" "$USERS" >> ".env.$ENV_NAME"
      - name: 🐞 Отладка .env файла
        run: |
          echo "=== Содержимое .env.${{ github.event.inputs.TARGET_ENV || 'dev' }} ==="
          cat ".env.${{ github.event.inputs.TARGET_ENV || 'dev' }}"
          echo "=== Первые 50 символов USERS ==="
          grep '^USERS=' ".env.${{ github.event.inputs.TARGET_ENV || 'dev' }}" | cut -c 1-50
          echo "=== Шестнадцатеричный дамп первых 20 байт ==="
          grep '^USERS=' ".env.${{ github.event.inputs.TARGET_ENV || 'dev' }}" | head -c 20 | xxd
      - name: 🧪 Сбор списка и запуск тестов в Docker
        run: |
          TEST_TARGETS="${{ github.event.inputs.TEST_FILES }}"
          if [ -z "$TEST_TARGETS" ]; then
            TEST_TARGETS="tests/"
          else
            TEST_TARGETS=$(echo $TEST_TARGETS | tr ',' ' ')
          fi
          export TEST_FILES="$TEST_TARGETS"
          echo "Запуск тестов в ${{ matrix.browser }}..."
          docker compose up --build --abort-on-container-exit --exit-code-from qa-mesto \
           || echo "⚠️ Тесты завершены (возможно есть упавшие)"
        env:
          BROWSER: ${{ matrix.browser }}
          TARGET_ENV: ${{ github.event.inputs.TARGET_ENV }}
          TEST_TYPE: ${{ github.event.inputs.TEST_TYPE }}
      - name: 📦 Сохранение результатов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: ./allure-results
          retention-days: 5
  generate_allure_report:
    needs: testing
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Скачивание результатов тестов
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results-combined
          merge-multiple: true # Сливает результаты всех браузеров в одну папку
      - name: 📊 Генерация Allure отчёта
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results-combined
          allure_report: allure-report
      - name: 📦 Подготовка к публикации Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report
  publish_to_pages:
    needs: generate_allure_report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Деплой на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
